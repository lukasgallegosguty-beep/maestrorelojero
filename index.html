/* ===== pantallas.js ===== */

  return `<div class="pt ini">${reloj(D.niveles[0], 'reverso', 'ini-mov', 104)}

    <div class="ini-bts">${P.existe ? '<button class="btn pri" data-a="ir" data-p="taller">Continuar</button>' : ''}
      <button class="btn ${P.existe ? '' : 'pri'}" data-a="nueva">Nueva partida</button>

A.p_nueva = function () {
  const ds = [['aprendiz', 'Aprendiz', 'Tolerancias amplias, nombres en la vista de memoria y ayudas de orientación.'], ['oficial', 'Oficial', 'Tolerancias medias y ayudas. Recomendado.'], ['maestro', 'Maestro', 'Tolerancias finas, sin ayudas. Tornillos que se pasan, resortes que saltan y pivotes que se quiebran.']];
  return `<div class="pt">${cab('Nueva partida', 'inicio')}<p style="color:var(--mar2);margin-bottom:12px">Elige la dificultad. Puedes cambiarla después en Ajustes.</p>
    <div class="enc">${ds.map(d => `<button class="enc-it" data-a="empezar" data-d="${d[0]}" style="grid-template-columns:minmax(0,1fr) auto"><span><h3>${d[1]}</h3><small>${d[2]}</small></span>${I('play')}</button>`).join('')}</div></div>`;
};
A.p_taller = function () {
  const e = P.s.encargo;
  let curso = '';
  if (e) { const n = D.nivel(e.nivelId); const fase = { diagnostico: 'Diagnóstico', desarmado: 'Desarmado', reparacion: 'Reparación', armado: 'Armado' }[e.fase] || e.fase;
    curso = `<div class="tarj curso" style="display:grid;gap:10px"><div><small style="color:var(--oro)">Encargo en curso · ${fase}</small><h3>${E(n.titulo)}</h3><small style="color:var(--mar2)">${E(n.calibre)} · ${E(n.cliente.nombre)} · plazo ${n.cliente.plazo_dias} días (día ${Math.max(1, P.s.dia - e.diaInicio + 1)})</small></div>
      <div style="display:flex;gap:8px"><button class="btn pri" style="flex:1" data-a="seguirEncargo">Seguir trabajando</button><button class="btn mini" data-a="abandonar">Abandonar</button></div></div>`; }
  const items = D.niveles.map(n => {
    const st = P.estadoNivel(n), r = P.s.niveles[n.id] || {};
    let sub = `${E(n.calibre)} · ${n.total_piezas} piezas`, der = `<div class="enc-pago num">${U.dinero(n.pago_base)}</div>`;
    if (st.estado === 'entregado') der = `<div class="enc-est">${est(r.estrellas || 1)}</div>`;
    if (st.estado === 'bloqueado') { sub = st.previo ? `Entrega primero «${E(st.previo.titulo)}»` : `Falta: ${st.faltan.map(h => E(D.herramienta(h).nombre)).join(', ')}`; der = I('candado'); }
    return `<button class="enc-it ${st.estado === 'bloqueado' ? 'bloq' : ''}" data-a="ficha" data-id="${n.id}"><span class="enc-n">${n.orden}</span><span><h3>${E(n.titulo)}</h3><small>${sub}</small></span>${der}</button>`;
  }).join('');
  return `<div class="pt"><div class="pt-cab"><button class="bt-ic" data-a="volver" data-p="inicio" aria-label="Inicio">${I('atras')}</button><h2>El taller</h2></div>${saldo()}
    <div class="nav4"><button data-a="ir" data-p="tienda">${I('herr')}Tienda</button><button data-a="ir" data-p="trabajos">${I('reparar')}Trabajos rápidos</button><button data-a="ir" data-p="vitrina">${I('estrella')}Vitrina</button><button data-a="ir" data-p="enciclopedia">${I('info')}Enciclopedia</button></div>
    ${curso}<div class="sec-t">Mostrador</div><div class="enc">${items}</div></div>`;
};
A.p_ficha = function (id) {
  const n = D.nivel(id), st = P.estadoNivel(n), e = P.s.encargo, enCurso = e && e.nivelId === id, otro = e && !enCurso;
  const sp = n.specs;
  const specs = [['Diámetro', sp.diametro_mm && U.num(sp.diametro_mm, 1) + ' mm' + (sp.lineas ? ' (' + sp.lineas + ')' : '')], ['Alto', sp.alto_mm && U.num(sp.alto_mm, 2) + ' mm'], ['Rubíes', sp.rubies], ['Frecuencia', sp.frecuencia_ah ? U.num(sp.frecuencia_ah) + ' A/h' : 'Cuarzo 32.768 Hz'], ['Reserva', sp.reserva_h && sp.reserva_h + ' h'], ['Cuerda', sp.cuerda], ['Funciones', (sp.funciones || []).join(', ')]].filter(x => x[1]);
  let pie;
  if (st.estado === 'bloqueado') pie = `<button class="btn" disabled>${st.previo ? 'Entrega antes el encargo anterior' : 'Faltan herramientas'}</button>${st.faltan.length ? '<button class="btn pri" data-a="ir" data-p="tienda" data-arg="h">Ir a la tienda</button>' : ''}`;
  else if (enCurso) pie = '<button class="btn pri" data-a="seguirEncargo">Seguir trabajando</button>';
  else if (otro) pie = '<button class="btn" disabled>Termina el encargo en curso</button>';
  else pie = `<button class="btn pri" data-a="aceptar" data-id="${id}">${st.estado === 'entregado' ? 'Volver a hacerlo' : 'Aceptar encargo'}</button>`;
  return `<div class="pt">${cab('N' + String(n.orden).padStart(2, '0') + ' · ' + n.titulo, enCurso && this.banco === null && P.s.encargo && P.s.encargo.fase !== 'reparacion' ? 'taller' : 'taller')}
    <div class="fic"><div class="tarj" style="display:grid;gap:8px"><small style="color:var(--oro)">${E(n.cliente.nombre)} · ${E(n.cliente.perfil)}</small><q>${E(n.cliente.pedido)}</q>
      <div class="sal"><span>Plazo <b>${n.cliente.plazo_dias} días</b></span><span>Pago <b class="num">${U.dinero(n.pago_base)}</b></span></div></div>
    <div class="tarj" style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center">${reloj(n, 'frente')}<div><h3>${E(n.reloj.nombre)}</h3><small style="color:var(--mar2)">${E(n.reloj.tipo)}</small><p style="margin-top:6px"><b>${E(n.calibre)}</b><br><small style="color:var(--mar2)">${E(n.casa)} · ${E(n.anio)} · ${E(n.epoca)}</small></p></div></div>
    <div class="sec-t">Ficha técnica</div><dl class="kv tarj">${specs.map(s => `<dt>${s[0]}</dt><dd>${E(s[1])}</dd>`).join('')}<dt>Piezas</dt><dd>${n.total_piezas} en ${n.total_pasos} pasos</dd></dl>
    <div class="sec-t">Historia</div><p>${E(n.historia)}</p>
    ${(n.sabias_que || []).length ? `<div class="sec-t">¿Sabías que?</div>${n.sabias_que.map(s => `<p style="margin-bottom:8px">${E(s)}</p>`).join('')}` : ''}
    <div class="sec-t">Lo nuevo en este encargo</div><div class="chips">${(n.mecanicas_nuevas || []).map(m => `<span>${E(m.replace(/_/g, ' '))}</span>`).join('')}</div></div>
    <div class="pie">${pie}</div></div>`;
};
A.p_reparacion = function () {
  const e = P.s.encargo, n = D.nivel(e.nivelId), R = MR.Reparacion;
  const todos = n.defectos || [], pend = e.defectosPendientes;
  const enPrueba = id => /^(regular|ajustar_ritmo)$/.test((D.defecto(id) || {}).operacion);
  const items = todos.map(id => {
    const d = D.defecto(id), hecho = !pend.includes(id), rq = R.requisitos(id), lp = enPrueba(id);
    let sub = E(d.descripcion);
    if (!hecho && rq.faltan.length) sub += `<br><span style="color:var(--rojo)">Falta: ${rq.faltan.map(h => E(D.herramienta(h).nombre)).join(', ')}</span>`;
    if (!hecho && rq.opcionales.length) sub += `<br><span style="color:var(--mar2)">Más fácil con: ${rq.opcionales.map(h => E(D.herramienta(h).nombre)).join(', ')}</span>`;
    if (!hecho && rq.rep) sub += `<br><span style="color:var(--oro)">Repuesto: ${E(rq.rep.nombre)} (${rq.rep.stock ? 'tienes ' + rq.rep.stock : U.dinero(rq.rep.precio)})</span>`;
    const der = hecho ? `<span style="color:var(--ok)">${I('check')}</span>` : lp ? '<small style="color:var(--mar2)">En la prueba</small>' : `<span class="btn mini pri">Reparar</span>`;
    return `<button class="enc-it" style="grid-template-columns:minmax(0,1fr) auto" ${hecho || lp ? 'disabled' : `data-a="reparar" data-id="${id}"`}><span><h3>${E(d.nombre)}</h3><small>${sub}</small></span>${der}</button>`;
  }).join('');
  const listos = pend.every(enPrueba);
  return `<div class="pt">${cab('Limpieza y reparación', 'taller')}<p style="color:var(--mar2);margin-bottom:12px">${E(n.calibre)} desarmado. Repara lo que anotaste en el diagnóstico antes de volver a armar.</p>
    <div class="enc">${items || '<p>Sin defectos que reparar.</p>'}</div>
    <div class="pie"><button class="btn" data-a="ir" data-p="tienda" data-arg="r">Tienda</button><button class="btn pri" data-a="armar" ${listos ? '' : 'disabled'}>Comenzar el armado</button></div></div>`;
};
A.p_resultado = function (r) {
  const n = D.nivel(r.nivelId);
  return `<div class="pt res"><h2>${E(n.titulo)}</h2><div class="res-est">${[1, 2, 3].map(i => `<span class="${i <= r.est ? '' : 'off'}">★</span>`).join('')}</div>
    <p style="font-family:var(--serif);font-size:18px;max-width:32ch">${E(r.frase)}</p>
    <dl class="kv tarj"><dt>Tiempo</dt><dd class="num">${U.tiempo(r.tiempo)} (objetivo ${U.tiempo(n.tiempo_objetivo_s)})</dd><dt>Pistas</dt><dd>${r.pistas}</dd><dt>Errores</dt><dd>${r.errores}</dd>${r.atraso ? `<dt>Atraso</dt><dd>${r.atraso} días</dd>` : ''}<dt>Pago</dt><dd class="num">${U.dinero(r.pago)}</dd>${r.propina ? `<dt>Propina</dt><dd class="num">${U.dinero(r.propina)}</dd>` : ''}<dt>Reputación</dt><dd>+${r.rep}</dd></dl>
    <div class="tot num">${U.dinero(r.pago + r.propina)}</div>
    <div class="ini-bts"><button class="btn pri" data-a="ir" data-p="taller">Al taller</button><button class="btn" data-a="ir" data-p="vitrina">Ver la vitrina</button></div></div>`;
};
A.p_tienda = function (tab) {
  const t = this.tab.tienda || tab || 'h', req = {};
  D.niveles.forEach(n => (n.herramientas_requeridas || []).forEach(h => (req[h] = req[h] || []).push(n.orden)));
  D.niveles.forEach(n => (n.defectos || []).forEach(d => ((D.defecto(d) || {}).herramientas || []).forEach(h => (req[h] = req[h] || []).includes(n.orden) || req[h].push(n.orden))));
  const lista = t === 'h' ? D.C.herramientas.filter(h => !h.inicial).sort((a, b) => a.precio - b.precio).map(h => {
    const tiene = P.tiene(h.id);
    return `<div class="tie-it"><b>${E(h.nombre)}</b>${tiene ? `<span style="color:var(--ok)">${I('check')}</span>` : `<button class="btn mini ${P.s.dinero >= h.precio ? 'pri' : ''}" data-a="comprar" data-t="h" data-id="${h.id}">${U.dinero(h.precio)}</button>`}<small>${E(h.efecto)}</small>${req[h.id] ? `<span class="tag">Para N${req[h.id].sort((a, b) => a - b).map(x => String(x).padStart(2, '0')).join(', N')}</span>` : ''}</div>`;
  }).join('') : D.C.repuestos.map(r => `<div class="tie-it"><b>${E(r.nombre)}</b><button class="btn mini ${P.s.dinero >= r.precio ? 'pri' : ''}" data-a="comprar" data-t="r" data-id="${r.id}">${U.dinero(r.precio)}</button><small>En stock: ${P.s.repuestos[r.id] || 0}</small></div>`).join('');
  const volver = P.s.encargo && P.s.encargo.fase === 'reparacion' ? 'reparacion' : 'taller';
  return `<div class="pt">${cab('Tienda', volver)}${saldo()}<div class="tabs" style="margin-top:12px"><button data-a="tab" data-k="tienda" data-v="h" class="${t === 'h' ? 'on' : ''}">Herramientas</button><button data-a="tab" data-k="tienda" data-v="r" class="${t === 'r' ? 'on' : ''}">Repuestos</button></div><div class="tie">${lista}</div></div>`;
};
A.p_trabajos = function () {
  const items = D.C.trabajosRapidos.map(t => { const falta = t.requiere.filter(h => !P.tiene(h));
    return `<div class="tie-it"><b>${E(t.nombre)}</b>${falta.length ? `<small style="color:var(--rojo);grid-column:2">${I('candado')}</small>` : `<button class="btn mini pri" data-a="trabajo" data-id="${t.id}">Hacer · ${U.dinero(t.pago)}</button>`}<small>${falta.length ? 'Necesitas: ' + falta.map(h => E(D.herramienta(h).nombre)).join(', ') : 'Cada dos trabajos pasa un día.'}</small></div>`; }).join('');
  return `<div class="pt">${cab('Trabajos rápidos')}${saldo()}<p style="color:var(--mar2);margin:12px 0">Encargos cortos y repetibles para juntar dinero.</p><div class="tie">${items}</div></div>`;
};
A.p_vitrina = function () {
  const c = P.s.coleccion;
  return `<div class="pt">${cab('Vitrina')}${c.length ? `<div class="vit">${c.slice().reverse().map(x => { const n = D.nivel(x.nivelId); return `<button class="tarj" data-a="ficha" data-id="${n.id}">${reloj(n, 'frente')}<b style="font-family:var(--serif)">${E(n.titulo)}</b><small style="color:var(--mar2)">${E(n.calibre)} · día ${x.dia}</small><span style="color:var(--oro)">${est(x.estrellas)}</span><small style="color:var(--mar2)">${E(x.frase)}</small></button>`; }).join('')}</div>` : '<p style="color:var(--mar2)">Aún no entregas relojes. Cada encargo terminado deja aquí su tarjeta.</p>'}</div>`;
};
A.p_enciclopedia = function () {
  const t = this.tab.enc || 'p';
  let h;
  if (t === 'p') {
    const ap = P.s.aprendidas.map(id => [id, D.tipo(id)]).sort((a, b) => a[1].categoria.localeCompare(b[1].categoria) || a[1].nombre.localeCompare(b[1].nombre));
    h = ap.length ? `<p style="color:var(--mar2);margin-bottom:10px">${ap.length} de ${Object.keys(D.C.tiposPieza).length} piezas aprendidas.</p><div class="tie">${ap.map(([id, x]) => `<div class="tie-it" style="grid-template-columns:1fr"><b>${E(x.nombre)}</b><small style="text-transform:capitalize;color:var(--oro)">${E(x.categoria.replace(/_/g, ' '))}</small><small>${E(x.funcion)}</small><small>Material: ${E(x.material)}</small></div>`).join('')}</div>` : '<p style="color:var(--mar2)">Toca o arma piezas en el banco para aprenderlas.</p>';
  } else {
    const vis = D.niveles.filter(n => P.s.niveles[n.id] || (P.s.encargo && P.s.encargo.nivelId === n.id) || P.estadoNivel(n).estado === 'disponible');
    h = `<div class="tie">${vis.map(n => `<div class="tie-it" style="grid-template-columns:1fr"><b>${E(n.calibre)}</b><small style="color:var(--oro)">${E(n.casa)} · ${E(n.anio)}</small><small>${E(n.historia)}</small>${(n.sabias_que || []).map(s => `<small>· ${E(s)}</small>`).join('')}${(n.fuentes || []).length ? `<small style="opacity:.7">Fuentes: ${n.fuentes.map(f => E(typeof f === 'string' ? f : (f.titulo || f.nombre || f.url || ''))).join(' · ')}</small>` : ''}</div>`).join('')}</div>`;
  }
  return `<div class="pt">${cab('Enciclopedia')}<div class="tabs"><button data-a="tab" data-k="enc" data-v="p" class="${t === 'p' ? 'on' : ''}">Piezas</button><button data-a="tab" data-k="enc" data-v="c" class="${t === 'c' ? 'on' : ''}">Calibres</button></div>${h}</div>`;
};
A.p_ajustes = function (desde) {
  const a = P.s.ajustes, tg = (k, t) => `<label><span>${t}</span><input type="checkbox" data-a="aj" data-k="${k}" ${a[k] ? 'checked' : ''}></label>`, sl = (k, t) => `<label><span>${t}</span><input type="range" min="0" max="1" step="0.05" value="${a[k]}" data-vol="${k}"></label>`;
  const volver = desde === 'banco' ? 'banco' : P.existe ? 'taller' : 'inicio';
  return `<div class="pt">${cab('Ajustes', volver)}<div class="aj">
    <label><span>Dificultad</span><span class="seg">${['aprendiz', 'oficial', 'maestro'].map(d => `<button data-a="dif" data-v="${d}" class="${P.s.dificultad === d ? 'on' : ''}">${d[0].toUpperCase() + d.slice(1)}</button>`).join('')}</span></label>
    ${sl('sonido', 'Efectos')}${sl('ticTac', 'Tic-tac')}${sl('ambiente', 'Ambiente')}
    ${tg('vibracion', 'Vibración')}${tg('zurdo', 'Modo zurdo')}${tg('texto', 'Texto grande')}${tg('contraste', 'Alto contraste')}${tg('reducirMovimiento', 'Reducir movimiento')}${tg('snap15', 'Redondear giros a 15°')}${tg('cruceta', 'Cruceta para pinzas')}
    <div class="sec-t">Partida</div><div class="tarj" style="display:grid;gap:8px"><button class="btn mini" data-a="exportar">Exportar (copiar texto)</button><textarea id="mr-exp" readonly placeholder="Toca Exportar"></textarea>
      <textarea id="mr-imp" placeholder="Pega aquí una partida exportada"></textarea><button class="btn mini" data-a="importar">Importar</button></div>
    <button class="btn" data-a="reiniciar" style="color:var(--rojo)">Reiniciar partida</button><button class="btn" data-a="ir" data-p="creditos">Créditos</button></div></div>`;
};
A.p_creditos = function () {
  return `<div class="pt">${cab('Créditos', P.existe ? 'taller' : 'inicio')}<div class="fic"><p><b>Maestro Relojero</b> · proyecto personal, sin publicidad ni compras.</p>
    <p>Movimientos, piezas, sonidos e íconos generados por código. Ilustraciones esquemáticas propias.</p>
    <p>Marcas mencionadas con fines descriptivos; juego no afiliado.</p><p>Clientes ficticios; cualquier parecido es coincidencia.</p>
    <p style="color:var(--mar2)">Datos técnicos: catálogo del proyecto (calibres, piezas y secuencias), con sus fuentes en cada ficha de la Enciclopedia.</p></div></div>`;
};
})();

}
